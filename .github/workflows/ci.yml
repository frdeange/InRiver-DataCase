name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

env:
  PYTHON_VERSION: "3.12"
  NODE_VERSION: "20"

jobs:
  lint-python:
    name: Lint Python (ruff)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install ruff
        run: pip install ruff

      - name: Ruff check
        run: ruff check . --output-format=github

      - name: Ruff format check
        run: ruff format --check .

  lint-ts:
    name: Lint TypeScript (eslint)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci
        continue-on-error: true

      - name: ESLint
        working-directory: frontend
        run: npx eslint . --max-warnings 0
        continue-on-error: true

  test-python:
    name: Test Python (pytest)
    runs-on: ubuntu-latest
    needs: lint-python
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install pytest pytest-cov pytest-asyncio

      - name: Run tests
        run: pytest tests/ -v --tb=short --cov=backend --cov-report=term-missing
        continue-on-error: true

  test-ts:
    name: Test TypeScript (vitest)
    runs-on: ubuntu-latest
    needs: lint-ts
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Install dependencies
        working-directory: frontend
        run: npm ci
        continue-on-error: true

      - name: Run tests
        working-directory: frontend
        run: npx vitest run
        continue-on-error: true

  build-docker:
    name: Build Docker Images
    runs-on: ubuntu-latest
    needs: [test-python, test-ts]
    steps:
      - uses: actions/checkout@v4

      - name: Build backend image
        run: |
          if [ -f backend/Dockerfile ]; then
            docker build -t inriver-api:ci backend/
          else
            echo "backend/Dockerfile not found — skipping"
          fi

      - name: Build frontend image
        run: |
          if [ -f frontend/Dockerfile ]; then
            docker build -t inriver-frontend:ci frontend/
          else
            echo "frontend/Dockerfile not found — skipping"
          fi

  validate-bicep:
    name: Validate Bicep
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Bicep CLI
        run: az bicep install

      - name: Build Bicep templates
        run: az bicep build --file infra/main.bicep

  validate-sql:
    name: Validate SQL Scripts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check SQL files exist
        run: |
          for f in database/schema.sql database/seed-acme.sql database/seed-nova.sql database/seed-apex.sql; do
            if [ ! -f "$f" ]; then
              echo "ERROR: Missing $f"
              exit 1
            fi
            echo "OK: $f ($(wc -l < "$f") lines)"
          done
