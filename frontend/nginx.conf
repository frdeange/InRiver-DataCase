server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # SPA routing — all paths serve index.html (React Router handles routing)
    location / {
        try_files $uri $uri/ /index.html;
    }

    # API calls go directly from the browser to the backend Container App URL
    # (configured via VITE_API_BASE_URL at build time — no server-side proxy needed)
}
